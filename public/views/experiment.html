// browser info
// https://stackoverflow.com/questions/11219582/how-to-detect-my-browser-version-and-operating-system-using-javascript
var nVer = navigator.appVersion;
var nAgt = navigator.userAgent;
var br_name = navigator.appName;
var br_full_version = '' + parseFloat(navigator.appVersion);
var br_major_version = parseInt(navigator.appVersion, 10);
var window_width = $(window).width();
var window_height = $(window).height();
var nameOffset, verOffset, ix;

// In Opera, the true version is after "Opera" or after "Version"
if ((verOffset = nAgt.indexOf("Opera")) != -1) {
    br_name = "Opera";
    br_full_version = nAgt.substring(verOffset + 6);
    if ((verOffset = nAgt.indexOf("Version")) != -1)
        br_full_version = nAgt.substring(verOffset + 8);
}
// In MSIE, the true version is after "MSIE" in userAgent
else if ((verOffset = nAgt.indexOf("MSIE")) != -1) {
    br_name = "Microsoft Internet Explorer";
    br_full_version = nAgt.substring(verOffset + 5);
}
// In Chrome, the true version is after "Chrome" 
else if ((verOffset = nAgt.indexOf("Chrome")) != -1) {
    br_name = "Chrome";
    br_full_version = nAgt.substring(verOffset + 7);
}
// In Safari, the true version is after "Safari" or after "Version" 
else if ((verOffset = nAgt.indexOf("Safari")) != -1) {
    br_name = "Safari";
    br_full_version = nAgt.substring(verOffset + 7);
    if ((verOffset = nAgt.indexOf("Version")) != -1)
        br_full_version = nAgt.substring(verOffset + 8);
}
// In Firefox, the true version is after "Firefox" 
else if ((verOffset = nAgt.indexOf("Firefox")) != -1) {
    browserName = "Firefox";
    br_full_version = nAgt.substring(verOffset + 8);
}
// In most other browsers, "name/version" is at the end of userAgent 
else if ((nameOffset = nAgt.lastIndexOf(' ') + 1) <
    (verOffset = nAgt.lastIndexOf('/'))) {
    browserName = nAgt.substring(nameOffset, verOffset);
    br_full_version = nAgt.substring(verOffset + 1);
    if (browserName.toLowerCase() == browserName.toUpperCase()) {
        browserName = navigator.appName;
    }
}
// trim the br_full_version string at semicolon/space if present
if ((ix = br_full_version.indexOf(";")) != -1)
    br_full_version = br_full_version.substring(0, ix);
if ((ix = br_full_version.indexOf(" ")) != -1)
    br_full_version = br_full_version.substring(0, ix);

br_major_version = parseInt('' + br_full_version, 10);
if (isNaN(br_major_version)) {
    br_full_version = '' + parseFloat(navigator.appVersion);
    br_major_version = parseInt(navigator.appVersion, 10);
}

/**
* Returns a random integer between min (inclusive) and max (inclusive).
* The value is no lower than min (or the next integer greater than min
* if min isn't an integer) and no greater than max (or the next integer
* lower than max if max isn't an integer).
* Using Math.round() will give you a non-uniform distribution!
*/
function getRandomInt(min, max) {
    min = Math.ceil(min);
    max = Math.floor(max);
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

/**
 * Shuffles array in place.
 * @param {Array} a items An array containing the items.
 */
function shuffle(a) {
    var j, x, i;
    for (i = a.length - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        x = a[i];
        a[i] = a[j];
        a[j] = x;
    }
    return a;
}

function onlyUnique(value, index, self) { 
    return self.indexOf(value) === index;
}

/**
 * Get parameter from URL.
 */
var getUrlParameter = function getUrlParameter(sParam) {
    var sPageURL = decodeURIComponent(window.location.search.substring(1)),
        sURLVariables = sPageURL.split('&'),
        sParameterName,
        i;
    for (i = 0; i < sURLVariables.length; i++) {
        sParameterName = sURLVariables[i].split('=');
        if (sParameterName[0] === sParam) {
            return sParameterName[1] === undefined ? true : sParameterName[1];
        }
    }
};

// fetch from the URL param

// if not provided, use CONST

    debug = SHOW_DEBUG;
} else {
    // convert from string to bool
    debug = /^true$/i.test(debug);
}

    console.log('debug', debug);

// fetch from the URL param

    save_data = /^true$/i.test(save_data);
}

    calibration_num = Number(calibration_num);
}

/**
 * Get code for the worker.
 */
function getWorkerCode() {
    // fetch from the URL param
    var worker_code = getUrlParameter('worker_code');
    // if not provided, generate
    if (worker_code == undefined) {
        var timestamp = window.performance.timing.navigationStart + window.performance.now();
        var current_time = Math.round(timestamp);
        var random_num = getRandomInt(1, 10000);
        worker_code = 'T3' + current_time + 'KC' + random_num + '8H';
        return worker_code;
    } else {
        return worker_code;
    }
    
}

var worker_code = getWorkerCode();

    console.log('worker_code', worker_code);

 * Initialise jsPsych.

/**

            worker_code: worker_code,
            interactions: interactions,
            window_width: $(window).width(),
            window_height: $(window).height()

            console.log('data saved');
        }
    }
}

        options: ["Male", "Female", "Other"],
        required: true
      },
      {
        prompt: "6. How often do you walk on roads?",
        name: "walking_frequency",
        options: ["Daily", "Few times a week", "Rarely"],
        required: true
      },
      {
        prompt: "7. In your city, do vehicles typically yield to pedestrians at marked crosswalks?",
        name: "vehicle_yield",
        options: ["Never", "Rarely", "Sometimes", "Usually", "Always"],
        required: true
      },
      {
        prompt: "8. How often do you use your smartphone while crossing the road?",
        name: "smartphone_while_crossing",
        options: ["Never", "Rarely", "Sometimes", "Often", "Always"],
        required: true
      }
    ],
    preamble: "Answer these questions."
  };

var section2_choice = {
    type: jsPsychSurveyMultiChoice,
    questions: [
      {
        prompt: "9. Have you heard of automated/driverless vehicles?",
        name: "av_awareness",
        options: ["Yes", "No", "Not sure"],
        required: true
      },
      {
        prompt: "10. Have you ever been a passenger in an automated/driverless vehicle?",
        name: "av_passenger_experience",
        options: ["Yes", "No"],
        required: true
      },
      {
        prompt: "11. How much do you trust automated/driverless vehicles to behave safely in your country's traffic conditions?",
        name: "av_trust",
        options: ["Not at all", "Slightly", "Moderately", "Highly", "Completely"],
        required: true
      }
    ],
    preamble: "Answer these questions."
  };

var preference_trial = {
    type: jsPsychSurveyMultiChoice,
    preamble: "Answer these final questions about your preferences and impressions.",
    questions: [
      {
        prompt: "Among the following, which eHMI type do you prefer most for safe crossing?",
        name: "ehmi_preference_safe_crossing",
        options: [
          "No eHMI",
          "Text display (English)",
          "Light signal (color-based)",
          "Symbol / Icon",
          "Regional language text"
        ],
        required: true
      },
      {
        prompt: "How much do you trust the vehicle to stop or yield when approaching a crosswalk?",
        name: "trust_vehicle_yield",
        options: [
          "Not at all",
          "Slightly",
          "Moderately",
          "Highly",
          "Completely"
        ],
        required: true
      },
      {
        prompt: "Which type of eHMI do you find most helpful overall?",
        name: "most_helpful_ehmi",
        options: [
          "Text",
          "Symbols / Icons",
          "Lights",
          "Combination of two or more"
        ],
        required: true
      },
      {
        prompt: "If you selected 'Combination' above, which two would you prefer?",
        name: "preferred_combination",
        options: [
          "Text + Light",
          "Text + Symbol",
          "Light + Symbol",
          "Not applicable (I did not select Combination)"
        ],
        required: true
      },
      {
        prompt: "Which vehicle type makes you feel least safe when crossing?",
        name: "least_safe_vehicle_type",
        options: [
          "Car",
          "Bus",
          "Two-wheeler"
        ],
        required: true
      },
      {
        prompt: "Where do you think the eHMI display should ideally be located on a vehicle?",
        name: "ideal_ehmi_location",
        options: [
          "Front windshield",
          "Hood/Bonnet",
          "Front grille",
          "Multiple locations simultaneously"
        ],
        required: true
      }
    ],
    button_label: "Next"
};

var preference_text_trial = {
    type: jsPsychSurveyText,
    preamble: "Answer these final questions about your preferences and impressions.",
    questions: [
      {
        prompt: "Were any of the images confusing or unrealistic? If yes, please describe briefly.",
        name: "confusing_unrealistic_images",
        rows: 4,
        columns: 80,
        required: false
      },
      {
        prompt: "What improvements would you suggest for vehicle-to-pedestrian communication?",
        name: "suggested_improvements",
        rows: 4,
        columns: 80,
        required: false
      }
    ],
    button_label: "Next"
};

var camera_instructions = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
    <div class="jumbotron jumbotron-fluid" style="text-align: left;"><div class="container"><h1 class="display-4">Configuration of camera</h1><p class="lead">In order to participate you must allow the experiment to use your camera. You will be prompted to do this on the next screen. If you do not wish to allow use of your camera, you cannot participate in this experiment. It may take up to 30 seconds for the camera to initialize after you give permission. No video recording from your camera will be saved. Only information about where you looked at the screen will be saved.<hr><p>Press \'C\' to proceed.</p></div></div>
    `,
    choices: ['C'],
}

var init_camera = {
    type: jsPsychWebgazerInitCamera
}

var calibration_instructions = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div class="jumbotron jumbotron-fluid" style="text-align: left;"><div class="container"><h1 class="display-4">Calibration of eye tracker</h1><p class="lead">Now you will calibrate the eye tracking, so that the software can use the image of your eyes to predict where you are looking. You will see a series of dots appear on the screen. Look at each dot and click on it.<hr><p>Press \'C\' to proceed.</p></div></div>
    `,
    choices: ['C'],
}

var calibration = {
    type: jsPsychWebgazerCalibrate,
    calibration_points: [
      [25,25],[75,25],[50,50],[25,75],[75,75]
    ],
    repetitions_per_point: calibration_num,
    randomize_calibration_order: true
}

var validation_instructions = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div class="jumbotron jumbotron-fluid" style="text-align: left;"><div class="container"><h1 class="display-4">Accuracy of the calibration</h1><p class="lead">Now we will measure the accuracy of the calibration. Look at each dot as it appears on the screen. <span style="font-weight: bold;">You do not need to click on the dots this time.</span><hr><p>Press \'C\' to proceed.</p></div></div>
    `,
    choices: ['C'],
    post_trial_gap: 1000
}

var validation = {
    type: jsPsychWebgazerValidate,
    validation_points: [
        [25,25],[75,25],[50,50],[25,75],[75,75]
    ],
    roi_radius: 200,
    time_to_saccade: 1000,
    validation_duration: 2000,
    data: {
        task: 'validate'
    }
}

var recalibrate_instructions = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
        <div class="jumbotron jumbotron-fluid" style="text-align: left;"><div class="container"><h1 class="display-4">Insufficient accuracy of calibration</h1><p class="lead">The accuracy of the calibration is a lower than we would like. Let's try calibrating one more time. On the next screen, look at the dots and click on them.<hr><p>Press \'C\' to proceed.</p></div></div>
    `,
    choices: ['C'],
}

var recalibrate = {
    timeline: [recalibrate_instructions, calibration, validation_instructions, validation],
    conditional_function: function(){
        var validation_data = jsPsych.data.get().filter({task: 'validate'}).values()[0];
        return validation_data.percent_in_roi.some(function(x){
            var minimum_percent_acceptable = 50;
            return x < minimum_percent_acceptable;
        });
    },
    data: {
        phase: 'recalibration'
    }
}

var calibration_done = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
        <div class="jumbotron jumbotron-fluid" style="text-align: left;"><div class="container"><h1 class="display-4">Calibration completed</h1><p class="lead">Calibration of eye tracking is complete, thank you for your patience. <hr><p>Press \'C\' to proceed to the instructions for the experiment.</p>
    `,
    choices: ['C'],
}

// block for sending data
var save_data_block = {
    type: jsPsychCallFunction,
    func: function() {
        saveData(); // save data
    }
}

// enter full screen
var fullscreen_enter = {
    type: jsPsychFullscreen,
    fullscreen_mode: true
}

// exit full screen
var fullscreen_exit = {
    type: jsPsychFullscreen,
    fullscreen_mode: false
}

// create experiment timeline array
var timeline = [];

/* preload images */
var preload = {
  type: jsPsychPreload,
  show_progress_bar: true,
  auto_preload: true,
  max_load_time: 3000000,
  images: images_preload,
};
timeline.push(preload);
if (debug) {
    console.log('preloading finished');
}

timeline.push(fullscreen_enter);  // enter full screen
if (eye_tracking) {  // toggle for using eye tracking
    timeline.push(camera_instructions); 
    timeline.push(init_camera); 
    timeline.push(calibration_instructions); 
    timeline.push(calibration); 
    timeline.push(validation_instructions); 
    timeline.push(validation); 
    timeline.push(recalibrate);
    timeline.push(calibration_done);
    timeline.push(save_data_block);  // save data
}

// instructions page
timeline.push(instructions_block);  // instructions
timeline.push(section1_text);    // questions
timeline.push(section1_choice);  // questions
timeline.push(section2_choice);  // questions
// iterate over blocks
var attention_q_index = 0;
for (var i = 0; i < n_images_per_participant * n_images_repeat; i++) {
    // inject attention question before this trial if scheduled
    if (attention_insert_at.indexOf(i) !== -1 && attention_q_index < attention_questions.length) {
        (function(idx) {
            var aq = attention_questions[idx];
            var question_page = {
                type: jsPsychSurveyMultiChoice,
                questions: [
                    {
                        prompt: aq.question,
                        name: 'attention_q_' + idx,
                        options: aq.options,
                        required: true
                    }
                ],
                on_finish: function(data) {
                    var response = data.response['attention_q_' + idx];
                    if (response !== aq.correct) {
                        attention_wrong_count++;
                        if (debug) {
                            console.log('Wrong answer for question', idx, '| total wrong:', attention_wrong_count);
                        }
                        if (attention_wrong_count >= MAX_WRONG_THRESHOLD) {
                            saveData(); // save data
                            window.location = 'finish_fail';
                        }
                    }
                }
            };
            timeline.push(question_page);
        })(attention_q_index);
        attention_q_index++;
    }
    timeline.push(continue_block); // page to continue to next trial
    timeline.push(image_stimuli[i]);  // page with the stimulus
    timeline.push(qs_image);
    timeline.push(qs_image_multi);
    timeline.push(save_data_block);  // save data
}
timeline.push(preference_trial);  // questions in the end
timeline.push(preference_text_trial);  // questions in the end 2
timeline.push(fullscreen_exit);  // exit full screen
// timeline.push(save_data_block);  // save data

if (debug) {
    console.log('timeline', timeline);
    console.log('image_ids', image_ids);
    console.log('image_stimuli', image_stimuli);
    console.log('images_preload', images_preload);
}

/* Start the experiment */
jsPsych.run(timeline);

</script>
